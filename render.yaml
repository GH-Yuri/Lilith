services:
  - type: worker
    name: lilith
    runtime: docker
    repo: https://github.com/GH-Yuri/Lilith
    plan: starter
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: AI_MODEL
        value: "gpt-4o-mini"
      - key: AI_TEMPERATURE
        value: "0.3"
      - key: TRADE_SYMBOL
        value: "BTC/USD"
      - key: ANALYSIS_INTERVAL_SECONDS
        value: "300"
