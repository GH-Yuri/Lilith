services:
  - type: worker
    name: lilith
    runtime: docker
    repo: https://github.com/your-username/Lilith
    plan: starter
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: TRADE_SYMBOLS
        value: "AAPL,MSFT,GOOGL"
      - key: CHECK_INTERVAL_SECONDS
        value: "60"
      - key: MAX_POSITION_PCT
        value: "0.05"
